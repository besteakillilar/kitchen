<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emre'nin Mutfağı</title>
<meta name="description" content="Kendi tariflerini ve ev alışveriş listeni tutan küçük mutfak defteri.">
<meta name="theme-color" content="#FBF5E9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Emre'nin Mutfağı">
</head>
<body>
<script src="ayarlar.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap');

  :root{
    --krem:#FBF5E9;
    --kart:#FFFDF7;
    --kart-2:#F6F1E4;
    --yesil:#7C8C63;
    --yesil-acik:#DEE6CE;
    --yesil-koyu:#5F6D4B;
    --kahve:#3E332A;
    --soluk:#8B7F70;
    --cizgi:#EBE2D0;
    --sari:#FBEFC8;
    --pembe:#FBE3DA;
    --mor:#E9E3F4;
    --kirmizi:#C4553F;
    --golge:0 6px 18px rgba(120,100,70,.10);
    --r:22px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #uygulama{
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    color:var(--kahve);
    background:var(--krem);
    min-height:100vh;
    padding-bottom:104px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.baslik-fontu{
    font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:600;letter-spacing:.2px;
    line-height:1.5;padding-bottom:.12em;overflow-wrap:break-word;
  }
  /* ş ç ğ gibi harflerin kuyruğu kesilmesin */
  h1,h2,h3,.baslik-fontu,.soru,.detay-baslik,.ust-bar h2,.tarif-kart .isim,.bos h3,
  .panel h3,.reyon-bas,.tencere-yazi,.adim .no,.rozet,.cip,.menu-dugme{overflow:visible;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{
    outline:3px solid var(--yesil);outline-offset:2px;border-radius:8px;
  }
  .sarmal{max-width:720px;margin:0 auto;padding:0 18px;}


  /* ---------- ev listesi ---------- */
  .liste-ust{background:var(--kart);border-radius:26px;padding:18px 20px 20px;box-shadow:var(--golge);margin-top:16px;}
  .liste-ozet{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px;}
  .liste-ozet b{font-family:'Baloo 2','Nunito',sans-serif;font-size:19px;font-weight:600;line-height:1.5;}
  .liste-ozet span{font-size:13px;color:var(--soluk);white-space:nowrap;flex:0 0 auto;}
  .ilerleme{height:9px;background:var(--kart-2);border-radius:999px;overflow:hidden;margin-bottom:18px;}
  .ilerleme i{display:block;height:100%;background:var(--yesil);border-radius:999px;transition:width .45s ease;}
  .ekle-kutu{display:flex;align-items:center;gap:8px;background:var(--kart-2);border-radius:20px;padding:6px 6px 6px 16px;}
  .ekle-kutu input{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:15.5px;color:inherit;padding:10px 0;}
  .ekle-kutu input:focus{outline:none;}
  .ekle-kutu button{
    flex:0 0 42px;height:42px;border-radius:50%;background:var(--yesil);color:#fff;
    font-size:24px;line-height:1;display:grid;place-items:center;
  }
  .reyonlar{display:flex;gap:7px;overflow-x:auto;margin:0 -20px;padding:12px 20px 2px;scrollbar-width:none;}
  .reyonlar::-webkit-scrollbar{display:none;}
  .reyon-cip{
    white-space:nowrap;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
    background:var(--kart-2);color:var(--soluk);font-size:13.5px;font-weight:700;
  }
  .reyon-cip.aktif{background:var(--yesil-acik);color:var(--yesil-koyu);box-shadow:inset 0 0 0 2px var(--yesil);}
  .reyon-kart{background:var(--kart);border-radius:24px;padding:4px 20px 10px;box-shadow:var(--golge);margin-top:14px;}
  .reyon-bas{display:flex;align-items:center;gap:9px;padding:14px 0 4px;font-family:'Baloo 2','Nunito',sans-serif;font-size:16px;font-weight:600;line-height:1.5;}
  .reyon-bas .adet{margin-left:auto;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:700;color:var(--soluk);background:var(--kart-2);border-radius:999px;padding:3px 11px;}
  .urun{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--cizgi);cursor:pointer;font-size:15.5px;line-height:1.4;}
  .urun .simge{font-size:18px;line-height:1;width:22px;text-align:center;}
  .urun .ad{flex:1;}
  .urun.alindi .ad{text-decoration:line-through;color:var(--soluk);}
  .urun .sil{color:#C9BFAF;font-size:20px;line-height:1;padding:0 2px;}
  .urun .sil:hover{color:var(--kirmizi);}
  .bos-liste{text-align:center;padding:46px 20px 34px;}
  .bos-liste .halka{
    width:96px;height:96px;border-radius:50%;background:var(--yesil-acik);margin:0 auto 16px;
    display:grid;place-items:center;font-size:42px;
  }
  .bos-liste p{color:var(--soluk);margin:6px 0 0;line-height:1.55;}

  /* ---------- açılış ---------- */
  .acilis{
    position:fixed;inset:0;background:var(--krem);z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:14px 14px 26px;overflow:hidden;
  }
  .acilis > img{max-width:min(100%,430px);max-height:60vh;object-fit:contain;border-radius:20px;transition:transform .8s ease,opacity .5s ease;}
  .acilis.aciliyor > img{transform:translateY(-10px) scale(.985);}
  .tencere-alan{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tencere{width:180px;padding:0;background:none;}
  .tencere svg{width:100%;height:auto;display:block;overflow:visible;}

  .tencere .govde{transform-origin:50% 100%;}
  .tencere .kapak{transform-origin:74% 94%;transition:transform .8s cubic-bezier(.28,1.3,.5,1);}
  .tencere:hover .kapak,.tencere:focus-visible .kapak{transform:translateY(-8px) rotate(-6deg);}
  .tencere .icerik{opacity:0;transition:opacity .5s ease .3s;}
  .tencere .parilti{opacity:0;}
  .tencere .buhar > *{opacity:0;}
  .sallan{animation:sallan 2.8s ease-in-out infinite;}
  @keyframes sallan{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}

  .acilis.aciliyor .tencere .kapak{transform:translate(66px,-92px) rotate(-46deg);}
  .acilis.aciliyor .tencere .icerik{opacity:1;}
  .acilis.aciliyor .sallan{animation:zipla .5s ease-out;}
  @keyframes zipla{0%{transform:translateY(0)}35%{transform:translateY(4px) scaleY(.96)}70%{transform:translateY(-3px)}100%{transform:translateY(0)}}
  .acilis.aciliyor .tencere .buhar > *{animation:duman 1.9s ease-out infinite;}
  .acilis.aciliyor .tencere .buhar > :nth-child(2){animation-delay:.35s;}
  .acilis.aciliyor .tencere .buhar > :nth-child(3){animation-delay:.7s;}
  @keyframes duman{
    0%{opacity:0;transform:translateY(14px) scale(.7);}
    25%{opacity:.85;}
    70%{opacity:.5;}
    100%{opacity:0;transform:translateY(-30px) scale(1.15);}
  }
  .acilis.aciliyor .tencere .parilti{animation:parilda .9s ease-out;}
  @keyframes parilda{0%{opacity:0;transform:scale(.4)}40%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}

  .yayilan{
    position:absolute;left:50%;top:46%;width:24px;height:24px;border-radius:50%;
    background:var(--kart);transform:translate(-50%,-50%) scale(0);pointer-events:none;
  }
  .acilis.gecis .yayilan{animation:yayil .62s cubic-bezier(.5,0,.35,1) forwards;}
  @keyframes yayil{to{transform:translate(-50%,-50%) scale(160);}}
  .tencere-yazi{font-family:'Baloo 2','Nunito',sans-serif;font-size:16px;color:var(--yesil-koyu);font-weight:600;line-height:1.6;transition:opacity .3s ease;}
  .acilis.aciliyor .tencere-yazi{opacity:0;}
  .girisle{animation:girisle .55s ease both;}
  @keyframes girisle{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @media(max-height:700px){.acilis > img{max-height:48vh;}.tencere{width:146px;}}

  /* ---------- üst görsel ---------- */
  .kapak-alan{position:relative;line-height:0;max-width:720px;margin:0 auto;}
  .kapak-alan img{width:100%;display:block;}
  .kapak-profil{
    position:absolute;left:88.2%;top:4.5%;width:7.6%;height:13%;border-radius:50%;
  }
  .ust-panel{
    background:#FDF9F0;border-radius:34px 34px 0 0;margin-top:-26px;position:relative;
    padding:26px 0 24px;min-height:56vh;
  }
  .soru{font-size:26px;margin:0 0 4px;line-height:1.45;}
  .soru-alt{margin:0;color:var(--soluk);font-size:15px;}
  .ust-bar{
    display:flex;align-items:center;gap:10px;padding:16px 20px 8px;max-width:720px;margin:0 auto;
  }
  .ust-bar h2{flex:1;text-align:center;font-size:24px;margin:0;line-height:1.5;padding-bottom:4px;}
  .ust-bar button{font-size:24px;width:34px;line-height:1;color:var(--kahve);}

  /* ---------- öğün kartları ---------- */
  .ogun-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .ogun{
    aspect-ratio:285/480;border-radius:20px;background-size:cover;background-position:center;
    position:relative;transition:transform .15s ease;box-shadow:var(--golge);
  }
  .ogun:hover,.ogun:focus-visible{transform:translateY(-3px);}
  .ogun .sayi{
    position:absolute;top:9px;right:9px;background:rgba(255,255,255,.85);
    border-radius:999px;min-width:26px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--soluk);
  }

  .bolum-basligi{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:12px;}
  .bolum-basligi h2{font-size:21px;margin:0;}
  .bolum-basligi .yan{font-size:13px;color:var(--soluk);}

  .ara-satiri{display:flex;gap:10px;margin-top:18px;}
  .arama{
    flex:1;display:flex;align-items:center;gap:10px;background:var(--kart);
    border:1px solid var(--cizgi);border-radius:999px;padding:12px 18px;box-shadow:var(--golge);
  }
  .arama input{border:none;background:none;flex:1;font-size:15px;font-family:inherit;color:inherit;}
  .arama input:focus{outline:none;}

  .filtreler{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:16px;scrollbar-width:none;}
  .filtreler::-webkit-scrollbar{display:none;}
  .cip{
    white-space:nowrap;padding:9px 18px;border-radius:999px;background:var(--kart-2);
    color:var(--soluk);font-size:14px;font-weight:600;
  }
  .cip.aktif{background:var(--yesil);color:#fff;}

  .tarif-izgara{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:660px){.tarif-izgara{grid-template-columns:repeat(3,1fr);}}
  .tarif-kart{
    position:relative;
    background:var(--kart);border-radius:var(--r);overflow:hidden;box-shadow:var(--golge);
    text-align:left;display:flex;flex-direction:column;transition:transform .15s ease;
  }
  .tarif-kart:hover,.tarif-kart:focus-visible{transform:translateY(-3px);}
  .kapak{
    aspect-ratio:4/3;background:var(--kart-2);position:relative;display:grid;place-items:center;
    font-size:44px;background-size:cover;background-position:center;
  }
  .kalp{
    position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.82);display:grid;place-items:center;font-size:16px;line-height:1;
  }
  .kalp.dolu{color:var(--kirmizi);}
  .tarif-kart .govde{padding:12px 14px 14px;}
  .tarif-kart .isim{font-family:'Baloo 2','Nunito',sans-serif;font-size:17px;font-weight:600;margin-bottom:6px;line-height:1.45;padding-bottom:3px;}
  .meta{display:flex;gap:14px;font-size:13px;color:var(--soluk);align-items:center;flex-wrap:wrap;}

  /* ---------- detay ---------- */
  .geri{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:var(--soluk);padding:16px 0 8px;}
  .detay-kapak{
    width:100%;height:min(46vw,300px);border-radius:26px;background:var(--kart-2);
    background-size:cover;background-position:center;display:grid;place-items:center;font-size:66px;
    box-shadow:var(--golge);
  }
  .detay-baslik{font-size:30px;margin:20px 0 8px;line-height:1.4;}
  .rozetler{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .rozet{background:var(--yesil-acik);color:var(--yesil-koyu);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;}
  .rozet.sade{background:var(--kart-2);color:var(--soluk);}

  .detay-izgara{display:grid;grid-template-columns:.86fr 1.14fr;gap:18px;align-items:start;}
  .panel{background:var(--kart);border-radius:var(--r);padding:20px;box-shadow:var(--golge);}
  .panel h3{margin:0 0 14px;font-size:18px;}
  .adim{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--cizgi);}
  .adim:last-child{border-bottom:none;padding-bottom:0;}
  .adim .no{
    font-family:'Baloo 2','Nunito',sans-serif;flex:0 0 30px;height:30px;border-radius:50%;background:var(--yesil-acik);color:var(--yesil-koyu);
    display:grid;place-items:center;font-weight:700;font-size:14px;line-height:1;
  }
  .adim p{margin:4px 0 0;line-height:1.55;font-size:15.5px;}
  .adim.bitti .no{background:var(--yesil);color:#fff;}
  .adim.bitti p{color:var(--soluk);}

  .malzeme{display:flex;align-items:flex-start;gap:11px;padding:10px 0;cursor:pointer;line-height:1.45;font-size:15px;}
  .malzeme + .malzeme{border-top:1px solid var(--cizgi);}
  .kutu{
    flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--yesil);margin-top:1px;
    display:grid;place-items:center;color:#fff;font-size:13px;
  }
  .malzeme.secili .kutu{background:var(--yesil);}
  .malzeme.secili span{text-decoration:line-through;color:var(--soluk);}
  .not{background:var(--sari);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5;margin-top:16px;}

  /* ---------- düğmeler ---------- */
  .dugme{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--yesil);color:#fff;
    padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;box-shadow:var(--golge);
  }
  .dugme.ikincil{background:var(--kart);color:var(--kahve);border:1px solid var(--cizgi);box-shadow:none;}
  .dugme.tehlike{background:none;color:var(--kirmizi);box-shadow:none;}
  .dugme.tam{width:100%;}
  .dugme[disabled]{opacity:.55;cursor:default;}
  .dugme-satiri{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

  /* ---------- form ---------- */
  .alan{margin-bottom:16px;}
  .alan label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;}
  .alan .ipucu{font-weight:400;color:var(--soluk);font-size:13px;}
  .alan input[type=text],.alan input[type=number],.alan select,.alan textarea{
    width:100%;padding:12px 14px;border:1px solid var(--cizgi);border-radius:14px;background:var(--kart);
    font-family:inherit;font-size:15px;color:inherit;
  }
  .alan select{
    appearance:none;-webkit-appearance:none;padding-right:42px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B7F70' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;background-size:17px;
  }
  /* öğün açılır menüsü */
  .acilir{position:relative;}
  .acilir-dugme{
    width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--cizgi);
    border-radius:14px;background:var(--kart);font-size:15px;text-align:left;
  }
  .acilir-dugme span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acilir-dugme span.soluk{color:var(--soluk);}
  .acilir-dugme i{font-style:normal;color:var(--soluk);transition:transform .2s ease;line-height:1;}
  .acilir.acik .acilir-dugme{border-color:var(--yesil);}
  .acilir.acik .acilir-dugme i{transform:rotate(180deg);}
  .acilir-liste{
    position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--kart);z-index:15;
    border:1px solid var(--cizgi);border-radius:18px;padding:6px;box-shadow:0 14px 30px rgba(120,100,70,.18);
  }
  .acilir-oge{
    width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
    font-size:15px;text-align:left;
  }
  .acilir-oge:hover{background:var(--kart-2);}
  .acilir-oge.secili{background:var(--yesil-acik);color:var(--yesil-koyu);font-weight:700;}
  .acilir-oge .kutu{flex:0 0 20px;height:20px;border-radius:6px;font-size:12px;margin:0;background:transparent;}
  .acilir-oge.secili .kutu{background:var(--yesil);}
  .alan textarea{min-height:130px;line-height:1.6;resize:vertical;}
  .ikili{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .gorsel-secim{display:flex;gap:14px;align-items:stretch;}
  .onizleme{
    flex:0 0 128px;height:118px;border-radius:18px;background:var(--kart-2) center/cover;
    display:grid;place-items:center;font-size:30px;position:relative;box-shadow:inset 0 0 0 1px var(--cizgi);
  }
  .onizleme .kaldir{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.92);color:var(--kirmizi);font-size:17px;line-height:1;display:grid;place-items:center;
  }
  .gorsel-secenek{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .gorsel-secenek .dosya-sec{
    flex:1;border:2px dashed #DCD0B8;border-radius:18px;background:var(--kart-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:12px;text-align:center;cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .gorsel-secenek .dosya-sec span{font-size:22px;}
  .gorsel-secenek .dosya-sec b{font-size:14.5px;}
  .gorsel-secenek .dosya-sec em{font-style:normal;font-size:12.5px;color:var(--soluk);line-height:1.4;}
  .gorsel-secenek .dosya-sec:hover,.gorsel-secenek .dosya-sec:focus-within{border-color:var(--yesil);background:var(--yesil-acik);}
  .gorsel-secenek .dosya-sec input{position:absolute;width:1px;height:1px;opacity:0;}
  .ogun-secim{display:flex;flex-wrap:wrap;gap:8px;}
  .ogun-secim .cip{border:none;}
  @media(max-width:460px){.gorsel-secim{flex-direction:column;}.onizleme{flex:0 0 120px;width:100%;}}

  /* ---------- alt menü ---------- */
  .alt-menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 28px);max-width:520px;
    background:var(--kart);border:1px solid var(--cizgi);border-radius:26px;box-shadow:0 10px 26px rgba(120,100,70,.18);
    display:grid;grid-template-columns:repeat(4,1fr);padding:8px;gap:4px;z-index:20;
  }
  .menu-dugme{padding:8px 4px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--soluk);font-weight:700;}
  .menu-dugme .ikon{font-size:18px;}
  .menu-dugme.aktif{background:var(--yesil-acik);color:var(--yesil-koyu);}
  .ekle-dugme{
    position:fixed;right:max(18px, calc(50% - 342px));bottom:96px;width:58px;height:58px;border-radius:50%;
    background:var(--yesil);color:#fff;font-size:28px;display:grid;place-items:center;
    box-shadow:0 10px 22px rgba(90,100,70,.35);z-index:21;
  }
  @media(max-width:600px){.ekle-dugme{right:18px;}}

  /* ---------- diğer ---------- */
  .bos{text-align:center;padding:54px 20px;color:var(--soluk);}
  .bos .buyuk{font-size:44px;margin-bottom:10px;}

<div id="uygulama"><div class="yukleniyor">Mutfak hazırlanıyor…</div></div>

<script>
(function(){
  const OGUNLER = {
    kahvalti:{ad:'Kahvaltı', emoji:'🍳', renk:'kahvalti', alt:'Güne lezzetli başla'},
    ogle:{ad:'Öğle Yemeği', emoji:'🍝', renk:'ogle', alt:'Pratik ve doyurucu'},
    aksam:{ad:'Akşam Yemeği', emoji:'🍲', renk:'aksam', alt:'Günün en güzel öğünü'},
    tatli:{ad:'Tatlı', emoji:'🍰', renk:'', alt:'Küçük bir ödül'},
    atistirmalik:{ad:'Atıştırmalık', emoji:'🥨', renk:'', alt:'Arada bir şeyler'}
  };
  const K = {dizin:'tarifler:dizin', tarif:id=>'tarif:'+id, favori:'favoriler', liste:'ev-listesi', isaret:'isaretler', ben:'ben'};

  const GRUPLAR = ['Manav','Market','Kasap','Temizlik','Diğer'];
  let D = {dizin:[], favoriler:[], liste:[], isaretler:{}, ben:'', grup:'Manav', ekran:'acilis', ogunAcik:false, girdi:'', filtre:'hepsi', arama:'', acikTarif:null, taslak:null, hazir:false};

  /* ---------- depolama: cihazın kendi hafızası ---------- */
  const ON_EK = 'emrenin-mutfagi:';
  const yerelAnahtar = (a, ortak) => ON_EK + (ortak ? 'ortak:' : 'hesap:' + (OTURUM.kullanici?.uid || 'kapali') + ':') + a;
  async function oku(anahtar, ortak=false){
    try{ const d = localStorage.getItem(yerelAnahtar(anahtar, ortak)); return d ? JSON.parse(d) : null; }
    catch(e){ return null; }
  }
  async function yaz(anahtar, deger, ortak=false){
    try{ localStorage.setItem(yerelAnahtar(anahtar, ortak), JSON.stringify(deger)); return true; }
    catch(e){ console.error(e); return false; }
  }
  async function sil(anahtar, ortak=false){
    try{ localStorage.removeItem(yerelAnahtar(anahtar, ortak)); return true; }catch(e){ return false; }
  }
  /* ---------- ortak mutfak (Firebase) ---------- */
  let BULUT = null;
  let AUTH, A, F, DB, BULUT_ADAYI;
  let oturumSurumu = 0;
  let dinleyiciler = [];
  const OTURUM = {durum:'yukleniyor', kullanici:null, mesaj:''};

  function veriyiTemizle(){
    dinleyiciler.forEach(dur => dur()); dinleyiciler = [];
    BULUT = null;
    Object.assign(D, {dizin:[], liste:[], favoriler:[], isaretler:{}, ben:'',
      acikTarif:null, taslak:null, arama:'', girdi:'', ekran:'acilis', hazir:false});
    kapat();
  }
  function girisEkrani(){
    const u = OTURUM.kullanici;
    return `<main class="giris-sayfa">
      <section class="giris-kart">
        <img src="ikon-192.png" alt="" width="88" height="88" style="border-radius:24px">
        <h1 style="font-family:'Baloo 2',sans-serif">Emre’nin Mutfağı</h1>
        <p>İkimize ait tarifler, birlikte hazırladığımız listeler.</p>
        <p role="status" style="line-height:1.6">${kacir(OTURUM.mesaj || (OTURUM.durum==='yukleniyor' ? 'Giriş kontrol ediliyor…' : 'Mutfağa girmek için Google hesabını seç.'))}</p>
        ${u ? `<p>${kacir(u.email || '')}</p><details style="margin:20px 0"><summary>Hesap kimliğim</summary><p style="overflow-wrap:anywhere;user-select:all">${kacir(u.uid)}</p><small>İlk kurulumda bu kimlik erişim listesine eklenir.</small></details>` : ''}
        ${OTURUM.durum!=='yukleniyor' ? `<button class="dugme" data-eylem="${u?'erisim-yenile':'google-giris'}" ${!AUTH?'disabled':''}>${u?'Erişimi tekrar kontrol et':'Google ile giriş yap'}</button>
        ${u?'<p><button class="dugme ikincil" data-eylem="cikis">Hesaptan çık</button></p>':''}
        ${!AUTH?'<p><button class="dugme ikincil" data-eylem="yeniden-baslat">Tekrar dene</button></p>':''}` : ''}
      </section></main>`;
  }
  async function googleGiris(){
    try{
      const saglayici = new A.GoogleAuthProvider();
      saglayici.setCustomParameters({prompt:'select_account'});
      await A.signInWithPopup(AUTH, saglayici);
    }catch(e){
      const mesajlar = {
        'auth/popup-closed-by-user':'Giriş iptal edildi. Hazır olduğunda tekrar deneyebilirsin.',
        'auth/popup-blocked':'Giriş penceresi engellendi. Safari veya Chrome’da açıp açılır pencerelere izin ver.',
        'auth/unauthorized-domain':'Bu site adresinin Firebase giriş ayarlarına eklenmesi gerekiyor.',
        'auth/operation-not-allowed':'Firebase’de Google ile giriş henüz etkinleştirilmemiş.',
        'auth/network-request-failed':'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.'
      };
      OTURUM.mesaj = mesajlar[e.code] || 'Giriş tamamlanamadı. Tekrar deneyebilirsin.'; ciz();
    }
  }
  async function cikis(){
    ++oturumSurumu; veriyiTemizle(); OTURUM.durum='yukleniyor'; OTURUM.mesaj='Çıkış yapılıyor…'; ciz();
    try{ await A.signOut(AUTH); }
    catch(e){ OTURUM.durum='kapali'; OTURUM.mesaj='Çıkış tamamlanamadı. Tekrar dene.'; ciz(); }
  }
  async function oturumDegisti(kullanici){
    const surum = ++oturumSurumu;
    veriyiTemizle(); OTURUM.kullanici=kullanici; OTURUM.durum=kullanici?'yukleniyor':'kapali'; OTURUM.mesaj=''; ciz();
    if(!kullanici) return;
    try{
      // Yetkiyi her yeni oturumda sunucudan doğrula; eski önbelleğe güvenme.
      const ref = F.doc(DB, 'erisim', 'mutfak');
      const belge = await F.getDocFromServer(ref);
      if(surum!==oturumSurumu) return;
      const uidler = belge.exists() ? belge.data().uidler : null;
      if(!Array.isArray(uidler) || uidler.length<1 || uidler.length>2 || new Set(uidler).size!==uidler.length || !uidler.includes(kullanici.uid)) throw new Error('yetkisiz');
      BULUT=BULUT_ADAYI; OTURUM.durum='acik';
      const [favoriler, isaretler, ben] = await Promise.all([oku(K.favori), oku(K.isaret), oku(K.ben)]);
      if(surum!==oturumSurumu) return;
      D.favoriler=favoriler||[]; D.isaretler=isaretler||{}; D.ben=ben||kullanici.displayName||'';
      const hata = e => {
        if(surum!==oturumSurumu) return;
        ++oturumSurumu; veriyiTemizle(); OTURUM.durum='kapali';
        OTURUM.mesaj=e.code==='permission-denied' ? 'Bu hesabın mutfağa erişim izni yok.' : 'Bağlantı doğrulanamadı. İnternetini kontrol edip tekrar dene.'; ciz();
      };
      dinleyiciler.push(F.onSnapshot(ref, belge=>{
        if(surum!==oturumSurumu) return;
        const ids=belge.data()?.uidler;
        if(!Array.isArray(ids) || ids.length<1 || ids.length>2 || new Set(ids).size!==ids.length || !ids.includes(kullanici.uid)) hata({code:'permission-denied'});
      }, hata));
      dinleyiciler.push(BULUT.tarifleriDinle(kayitlar=>{
        if(surum!==oturumSurumu) return;
        D.dizin=kayitlar.sort((a,b)=>(b.tarih||0)-(a.tarih||0)); veriDegisti();
      }, hata));
      dinleyiciler.push(BULUT.listeyiDinle(urunler=>{
        if(surum!==oturumSurumu) return;
        D.liste=urunler; veriDegisti();
      }, hata));
      D.hazir=true; ciz();
    }catch(e){
      if(surum!==oturumSurumu) return;
      veriyiTemizle(); OTURUM.durum='kapali';
      OTURUM.mesaj=(e.code==='permission-denied'||e.message==='yetkisiz') ? 'Bu hesap için erişim açılmamış. Yalnızca izin verilen hesaplar mutfağa girebilir.' : 'Erişim doğrulanamadı. İnternet bağlantını kontrol edip tekrar dene.'; ciz();
    }
  }
  const SURUM_FB = '10.12.5';

  function ayarlarVar(){
    const a = window.MUTFAK_AYARLARI;
    return !!(a && a.firebase && a.firebase.apiKey && a.firebase.projectId && a.mutfakKodu
              && !String(a.firebase.apiKey).includes('BURAYA'));
  }

  async function bulutuBaslat(){
    if(!ayarlarVar()) return null;
    const [{ initializeApp, getApps, getApp }, firestore, auth] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${SURUM_FB}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${SURUM_FB}/firebase-firestore.js`),
      import(`https://www.gstatic.com/firebasejs/${SURUM_FB}/firebase-auth.js`)
    ]);
    F=firestore; A=auth;
    const uyg = getApps().length ? getApp() : initializeApp(window.MUTFAK_AYARLARI.firebase);
    // Tarifleri diskte kalıcı önbelleğe alma; çıkışta sonraki hesaba taşınmasın.
    const db = F.initializeFirestore(uyg, {localCache:F.memoryLocalCache()});
    DB=db; AUTH=A.getAuth(uyg);
    const kod = String(window.MUTFAK_AYARLARI.mutfakKodu);
    const kol = ad => F.collection(db, 'mutfaklar', kod, ad);
    const bel = (ad, id) => F.doc(db, 'mutfaklar', kod, ad, String(id));
    return {
      tarifleriDinle(cb, hata){ return F.onSnapshot(kol('tarifler'), g => cb(g.docs.map(d=>d.data())), hata); },
      listeyiDinle(cb, hata){ return F.onSnapshot(kol('liste'), g => cb(g.docs.map(d=>d.data())), hata); },
      async tarifAl(id){ const d = await F.getDoc(bel('tarif-detay', id)); return d.exists() ? d.data() : null; },
      async tarifYaz(t, ozet){ const batch=F.writeBatch(db); batch.set(bel('tarif-detay',t.id),t); batch.set(bel('tarifler',t.id),ozet); await batch.commit(); return true; },
      async tarifSil(id){ const batch=F.writeBatch(db); batch.delete(bel('tarif-detay',id)); batch.delete(bel('tarifler',id)); await batch.commit(); },
      async urunYaz(u){ await F.setDoc(bel('liste', u.id), u); },
      async urunSil(id){ await F.deleteDoc(bel('liste', id)); },
      async urunleriSil(idler){ await Promise.all(idler.map(i => F.deleteDoc(bel('liste', i)))); }
    };
  }

  /* ---------- veri işlemleri: bulut varsa bulut, yoksa cihaz ---------- */
  function bulutGerekli(){
    if(OTURUM.durum!=='acik' || !BULUT) throw new Error('Önce izinli hesabınla giriş yap.');
    return BULUT;
  }
  async function tarifGetir(id){ return bulutGerekli().tarifAl(id); }
  async function tarifKaydet(t, ozet){
    try{ await bulutGerekli().tarifYaz(t,ozet); return true; }
    catch(e){ console.error(e); return false; }
  }
  async function tarifKaldir(id){ await bulutGerekli().tarifSil(id); }
  async function urunKaydet(u){
    await bulutGerekli().urunYaz(u);
  }
  async function urunKaldir(id){ await bulutGerekli().urunSil(id); }
  async function alinanlariSil(){
    const idler=D.liste.filter(u=>u.bitti).map(u=>u.id);
    if(idler.length) await bulutGerekli().urunleriSil(idler);
  }

  function dosyaIndir(ad, icerik){
    const b = new Blob([icerik], {type:'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = ad; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1500);
  }
  async function disaAktar(){
    const tarifler = [];
    for(const t of D.dizin){ const tam = await tarifGetir(t.id); if(tam) tarifler.push(tam); }
    const paket = {surum:1, tarih:Date.now(), tarifler, liste:D.liste};
    dosyaIndir('emrenin-mutfagi-yedek.json', JSON.stringify(paket));
    bildir(tarifler.length+' tarif dosyaya aktarıldı');
  }
  async function iceAktar(dosya){
    try{
      const paket = JSON.parse(await dosya.text());
      if(!paket || !Array.isArray(paket.tarifler)) throw new Error('bicim');
      let eklenen = 0;
      for(const t of paket.tarifler){
        if(!t || !t.id) continue;
        const kaydedildi = await tarifKaydet(t, {id:t.id, ad:t.ad, ogunler:ogunleri(t), sure:t.sure, zorluk:t.zorluk, kucuk:t.kucuk||'', ekleyen:t.ekleyen, tarih:t.tarih||Date.now()});
        if(!kaydedildi) throw new Error('Tarif kaydedilemedi');
        eklenen++;
      }
      if(Array.isArray(paket.liste) && paket.liste.length){
        const adlar = new Set(D.liste.map(u=>u.ad));
        for(const u of paket.liste){ if(u && u.ad && !adlar.has(u.ad)) await urunKaydet({id:u.id||yeniId(), ad:u.ad, grup:GRUPLAR.includes(u.grup)?u.grup:'Diğer', bitti:!!u.bitti}); }
      }
      kapat();
      bildir(eklenen+' tarif eklendi ♡');
    }catch(e){ console.error(e); bildir('Dosya okunamadı, yedek dosyası olduğundan emin ol'); }
  }

  /* ---------- yardımcılar ---------- */
  const ogunleri = t => (t && t.ogunler && t.ogunler.length) ? t.ogunler : (t && t.ogun ? [t.ogun] : []);
  const kacir = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const satirlar = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const yeniId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  function bildir(mesaj){
    document.querySelectorAll('.bildirim').forEach(e=>e.remove());
    const el = document.createElement('div');
    el.className='bildirim'; el.textContent=mesaj; el.setAttribute('role','status');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }

  function gorselKucult(dosya, enBoy, kalite){
    return new Promise((coz, red)=>{
      const okuyucu = new FileReader();
      okuyucu.onerror = ()=>red(new Error('okunamadi'));
      okuyucu.onload = ()=>{
        const im = new Image();

  function anaEkran(){
    const say = k => D.dizin.filter(t=>ogunleri(t).includes(k)).length;
    const son = D.dizin.slice(0,4);
    return `<div class="kapak-alan">
      <img src="${G.anaGorsel}" alt="Emrenin Mutfağı — mutfakta gülümseyen aşçı">
      <button class="kapak-profil" data-eylem="paylasim-bilgisi" aria-label="Paylaşım bilgisi ve ayarlar"></button>
    </div>
    <div class="ust-panel"><div class="sarmal">
      <h1 class="soru">Bugün ne yapmak istiyorsun?&nbsp;♡</h1>
      <p class="soru-alt">Hangi öğün için bir tarif arıyorsun?</p>
      <div class="ogun-izgara">
        ${['kahvalti','ogle','aksam'].map(k=>`
          <button class="ogun" style="background-image:url('${G[k]}')" data-eylem="ogun" data-deger="${k}"
                  aria-label="${OGUNLER[k].ad} tariflerini aç">
            <span class="sayi">${say(k)}</span>
          </button>`).join('')}
      </div>
      <div class="ara-satiri">
        <div class="arama">
          <span aria-hidden="true">🔍</span>
          <input type="text" placeholder="Tarif ara…" value="${kacir(D.arama)}" data-eylem="arama-girdi" aria-label="Tarif ara">
        </div>
      </div>
      ${son.length ? `
        <div class="bolum-basligi">
          <h2>Son eklenenler</h2>
          <button class="yan" data-eylem="ekran" data-deger="tarifler">tümünü gör</button>
        </div>
        <div class="tarif-izgara">${son.map(kartHtml).join('')}</div>` : bosHtml('Mutfak henüz boş','İlk tarifini ekle, buradan görünsün.')}
    </div></div>`;
  }

  function kartHtml(t){
    const favori = D.favoriler.includes(t.id);
    const kapak = t.kucuk ? `style="background-image:url('${t.kucuk}')"` : '';
    return `<div class="tarif-kart">
      <button class="kapak" ${kapak} data-eylem="tarif-ac" data-deger="${t.id}" aria-label="${kacir(t.ad)} tarifini aç">
        ${t.kucuk ? '' : (OGUNLER[ogunleri(t)[0]]?.emoji || '🍽️')}
      </button>
      <button class="kalp ${favori?'dolu':''}" data-eylem="favori" data-deger="${t.id}" aria-label="Favorilere ekle" aria-pressed="${favori}">${favori?'♥':'♡'}</button>
      <div class="govde">
        <button class="isim" data-eylem="tarif-ac" data-deger="${t.id}" style="text-align:left">${kacir(t.ad)}</button>
        <div class="meta">
          <span>🕐 ${kacir(t.sure||'—')} dk</span>
          <span>🍴 ${kacir(t.zorluk||'Kolay')}</span>
        </div>
      </div>
    </div>`;
  }

  function bosHtml(baslik, metin, dugme){
    return `<div class="bos">
      <div class="buyuk">🍳</div>
      <h3>${baslik}</h3>
      <p>${metin}</p>
      ${dugme===false?'':`<button class="dugme" data-eylem="ekran" data-deger="form">Tarif ekle</button>`}
    </div>`;
  }

  function tariflerEkrani(){
    const anahtar = D.arama.toLocaleLowerCase('tr');
    const liste = D.dizin.filter(t=>{
      const ogunTamam = D.filtre==='hepsi' || ogunleri(t).includes(D.filtre);
      const aramaTamam = !anahtar || (t.ad+' '+(t.ekleyen||'')).toLocaleLowerCase('tr').includes(anahtar);
      return ogunTamam && aramaTamam;
    });
    const baslik = D.filtre==='hepsi' ? 'Tüm Tarifler' : OGUNLER[D.filtre].ad+' Tarifleri';
    return `<div class="ust-bar">
      <button data-eylem="ekran" data-deger="ana" aria-label="Ana sayfaya dön">‹</button>
      <h2>${baslik}</h2>
      <button data-eylem="ekran" data-deger="favoriler" aria-label="Favoriler">♡</button>
    </div>
    <div class="kapak-alan">
      <img src="${G.tarifGorsel}" alt="Tavada yumurta çeviren aşçı">
    </div>
    <div class="sarmal">
      <div class="arama" style="margin-top:18px">
        <span aria-hidden="true">🔍</span>
        <input type="text" placeholder="Tarif ara…" value="${kacir(D.arama)}" data-eylem="arama-girdi" aria-label="Tarif ara">
        <button data-eylem="yenile" aria-label="Tarifleri yenile" style="color:var(--soluk);font-size:17px">↻</button>
      </div>
      <div class="filtreler">
        <button class="cip ${D.filtre==='hepsi'?'aktif':''}" data-eylem="filtre" data-deger="hepsi">Tümü</button>
        ${Object.keys(OGUNLER).map(k=>`<button class="cip ${D.filtre===k?'aktif':''}" data-eylem="filtre" data-deger="${k}">${OGUNLER[k].ad}</button>`).join('')}
      </div>
      ${liste.length ? `<div class="tarif-izgara">${liste.map(kartHtml).join('')}</div>`
        : bosHtml('Burada tarif yok','Başka bir öğün seç ya da yeni bir tarif ekle.')}
    </div>`;
  }

  function favoriEkrani(){
    const liste = D.dizin.filter(t=>D.favoriler.includes(t.id));
    return `<div class="sarmal">
      <div class="bolum-basligi" style="margin-top:26px"><h2>Favoriler</h2>
        <span class="yan">${liste.length} tarif</span></div>
      ${liste.length ? `<div class="tarif-izgara">${liste.map(kartHtml).join('')}</div>`
        : bosHtml('Favori listen boş','Beğendiğin tarifin kalbine dokun, burada biriksin.', false)}
    </div>`;
  }

  const REYON = {'Manav':'🥬','Market':'🛒','Kasap':'🥩','Temizlik':'🧼','Diğer':'✨'};
  const SIMGELER = [
    ['domates','🍅'],['salatalık','🥒','kornişon'],['biber','🌶️'],['patlıcan','🍆'],['patates','🥔'],
    ['soğan','🧅'],['sarımsak','🧄'],['havuç','🥕'],['marul','🥬'],['ıspanak','🥬'],['maydanoz','🌿'],

  const SIRALI_SIMGELER = [...SIMGELER].sort((a,b)=>b[0].length-a[0].length);
  function urunSimge(ad, grup){
    const k = String(ad||'').toLocaleLowerCase('tr');
    const kelimeler = k.split(/[^a-zçğıöşü]+/i).filter(Boolean);
    for(const [anahtar, simge] of SIRALI_SIMGELER){
      // kısa kelimeler (et, un, su) sadece tam kelime olarak eşleşsin: "deterjanı" içindeki "et" saymasın
      if(anahtar.length <= 3){
        if(kelimeler.some(kel=>kel === anahtar || kel.startsWith(anahtar))) return simge;
      } else if(k.includes(anahtar)) return simge;
    }
    return REYON[grup] || '•';
  }

  function urunSatiri(u){
    return `<div class="urun ${u.bitti?'alindi':''}" data-eylem="liste-degistir" data-deger="${u.id}" role="button" tabindex="0" aria-pressed="${!!u.bitti}">
      <span class="kutu" style="background:${u.bitti?'var(--yesil)':'transparent'}">${u.bitti?'✓':''}</span>

    return `<div class="ust-bar">
      <button data-eylem="ekran" data-deger="ana" aria-label="Ana sayfaya dön">‹</button>

        <div class="liste-ozet">

        </div>
        <div class="ilerleme" role="progressbar" aria-valuenow="${yuzde}" aria-valuemin="0" aria-valuemax="100"><i style="width:${yuzde}%"></i></div>

      ${dolu.length ? dolu.map(g=>{
        const urunler = D.liste.filter(u=>u.grup===g).sort((a,b)=>(a.bitti?1:0)-(b.bitti?1:0));
        return `<section class="reyon-kart">

    </div>`;

  function altMenu(){
    const ogeler = [['ana','🏠','Ana Sayfa'],['favoriler','♡','Favoriler'],['tarifler','📖','Tarifler'],['liste','🛒','Alışveriş Listesi']];
    return `<nav class="alt-menu">
      ${ogeler.map(([e,i,a])=>`<button class="menu-dugme ${D.ekran===e?'aktif':''}" data-eylem="ekran" data-deger="${e}">
        <span class="ikon" aria-hidden="true">${i}</span>${a}</button>`).join('')}
    </nav>
    ${(D.ekran==='form'||D.ekran==='liste')?'':`<button class="ekle-dugme" data-eylem="yeni" aria-label="Yeni tarif ekle">+</button>`}`;
  }

  function ciz(){
    const k = document.getElementById('uygulama');
    k.dataset.ekran = OTURUM.durum==='acik' ? D.ekran : 'giris';
    if(OTURUM.durum!=='acik'){ k.innerHTML=girisEkrani(); return; }
    let govde='';
    if(!D.hazir) govde = `<div class="yukleniyor">Mutfak hazırlanıyor…</div>`;
    else if(D.ekran==='acilis') govde = acilisEkrani();
    else if(D.ekran==='ana') govde = anaEkran();
    else if(D.ekran==='tarifler') govde = tariflerEkrani();
    else if(D.ekran==='favoriler') govde = favoriEkrani();
    else if(D.ekran==='liste') govde = listeEkrani();
    else if(D.ekran==='detay') govde = detayEkrani();
    else if(D.ekran==='form') govde = formEkrani();
    k.innerHTML = govde + ((D.hazir && D.ekran!=='acilis')?altMenu():'');
    if(D.ekran==='form') formuBagla();
  }

  /* ---------- form olayları ---------- */
  function formuOku(){
    const al = id => (document.getElementById(id)||{}).value || '';
    D.taslak = Object.assign({}, D.taslak, {
      ad: al('f-ad').trim(),
      zorluk: al('f-zorluk'),
      sure: al('f-sure').trim(),
      ekleyen: al('f-ekleyen').trim(),
      not: al('f-not').trim(),
      malzemeler: satirlar(al('f-malzeme')),
      adimlar: satirlar(al('f-adim'))
    });
  }
  function formuBagla(){
    const dosya = document.getElementById('f-dosya');
    if(!dosya) return;
    dosya.addEventListener('change', async e=>{
      const f = e.target.files[0]; if(!f) return;
      bildir('Görsel hazırlanıyor…');
      try{
        formuOku();
        D.taslak.gorsel = await gorselKucult(f, 900, .72);
        D.taslak.kucuk  = await gorselKucult(f, 340, .55);
        ciz();
        bildir('Görsel eklendi');
      }catch(err){ bildir('Bu görsel açılamadı, başka bir dosya dene'); }
    });
  }

  async function kaydet(){
    formuOku();
    const t = D.taslak;
    if(!t.ad){ bildir('Tarifin bir adı olmalı'); return; }
    if(!ogunleri(t).length){ bildir('En az bir öğün seç'); return; }
    if(!t.malzemeler.length){ bildir('En az bir malzeme yaz'); return; }
    if(!t.adimlar.length){ bildir('En az bir adım yaz'); return; }

    const dugme = document.querySelector('[data-eylem="kaydet"]');
    if(dugme){ dugme.disabled = true; dugme.textContent = 'Kaydediliyor…'; }

    t.id = t.id || yeniId();
    t.tarih = t.tarih || Date.now();
    if(t.ekleyen && t.ekleyen !== D.ben){ D.ben = t.ekleyen; yaz(K.ben, D.ben); }

    const tamam = await tarifKaydet(t, {id:t.id, ad:t.ad, ogunler:ogunleri(t), sure:t.sure, zorluk:t.zorluk, kucuk:t.kucuk||'', ekleyen:t.ekleyen, tarih:t.tarih});
    if(!tamam){
      bildir('Kaydedilemedi. Görsel çok büyük olabilir ya da bağlantı yok.');
      if(dugme){ dugme.disabled=false; dugme.textContent='Tarifi kaydet'; }
      return;
    }
    D.acikTarif = t; D.taslak = null; D.ekran='detay';
    ciz(); bildir('Tarif kaydedildi ♡');
  }

  /* ---------- ev listesi işlemleri ---------- */
  async function urunEkle(){
    const girdi = document.querySelector('[data-eylem="liste-girdi"]');
    const ad = ((girdi?girdi.value:'') || D.girdi || '').trim();
    if(!ad){ if(girdi) girdi.focus(); return; }
    D.girdi = '';
    await urunKaydet({id:yeniId(), ad, grup:D.grup, bitti:false});
    const y = document.querySelector('[data-eylem="liste-girdi"]'); if(y){ y.value=''; y.focus(); }
  }

  /* ---------- olay yönlendirme ---------- */
  document.getElementById('uygulama').addEventListener('click', async e=>{
    const d = e.target.closest('[data-eylem]');
    const simdiki = d ? d.dataset.eylem : '';
    if(simdiki==='google-giris'){ await googleGiris(); return; }
    if(simdiki==='cikis'){ await cikis(); return; }
    if(simdiki==='erisim-yenile'){ await oturumDegisti(AUTH.currentUser); return; }
    if(simdiki==='yeniden-baslat'){ location.reload(); return; }
    if(OTURUM.durum!=='acik') return;
    if(D.ogunAcik && !e.target.closest('.acilir')){
      if(D.ekran==='form') formuOku();
      D.ogunAcik = false;
      if(!d){ ciz(); return; }
    }
    if(!d) return;
    const eylem = simdiki, deger = d.dataset.deger;

    try {
    if(eylem==='gir'){
      const perde = document.getElementById('acilis');
      const yavas = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!perde || yavas){ D.ekran='ana'; ciz(); return; }
      perde.classList.add('aciliyor');
      setTimeout(()=>perde.classList.add('gecis'), 1050);
      setTimeout(()=>{
        D.ekran='ana'; ciz(); window.scrollTo(0,0);
        const k = document.getElementById('uygulama');
        k.classList.add('girisle');
        setTimeout(()=>k.classList.remove('girisle'), 700);
      }, 1520);
    }
    else if(eylem==='ekran'){ if(D.ekran==='form') D.taslak=null; D.ogunAcik=false; D.ekran=deger; ciz(); window.scrollTo(0,0); }
    else if(eylem==='ogun'){ D.filtre=deger; D.ekran='tarifler'; ciz(); window.scrollTo(0,0); }
    else if(eylem==='filtre'){ D.filtre=deger; ciz(); }
    else if(eylem==='geri'){ D.taslak=null; D.ogunAcik=false; D.ekran = D.acikTarif && D.ekran==='form' ? 'detay' : 'tarifler'; ciz(); }
    else if(eylem==='yeni'){ D.ogunAcik=false; D.taslak={ogunler:[],zorluk:'Kolay',ekleyen:D.ben,malzemeler:[],adimlar:[]}; D.acikTarif=null; D.ekran='form'; ciz(); window.scrollTo(0,0); }
    else if(eylem==='duzenle'){ D.taslak=Object.assign({},D.acikTarif); D.ekran='form'; ciz(); window.scrollTo(0,0); }
    else if(eylem==='kaydet'){ await kaydet(); }
    else if(eylem==='ogun-menu'){ formuOku(); D.ogunAcik = !D.ogunAcik; ciz(); }
    else if(eylem==='ogun-sec'){
      formuOku();
      const mevcut = ogunleri(D.taslak);
      D.taslak.ogunler = mevcut.includes(deger) ? mevcut.filter(x=>x!==deger) : [...mevcut, deger];
      delete D.taslak.ogun;
      ciz();
    }
    else if(eylem==='gorsel-kaldir'){ formuOku(); D.taslak.gorsel=''; D.taslak.kucuk=''; ciz(); }
    else if(eylem==='yenile'){ if(BULUT){ ciz(); bildir('Liste zaten canlı ♡'); } else { await yukle(); bildir('Yenilendi'); } }

    else if(eylem==='tarif-ac'){
      D.ekran='detay'; D.acikTarif=null; ciz();
      const t = await tarifGetir(deger);
      if(!t){ bildir('Tarif açılamadı'); D.ekran='tarifler'; ciz(); return; }
      D.acikTarif = t; ciz(); window.scrollTo(0,0);
    }
    else if(eylem==='favori'){
      D.favoriler = D.favoriler.includes(deger) ? D.favoriler.filter(x=>x!==deger) : [...D.favoriler, deger];
      yaz(K.favori, D.favoriler); ciz();
    }
    else if(eylem==='adim' || eylem==='malzeme'){
      const t=D.acikTarif; const im = (eylem==='adim'?'a':'m')+deger;
      const mevcut = D.isaretler[t.id] || [];
      D.isaretler[t.id] = mevcut.includes(im) ? mevcut.filter(x=>x!==im) : [...mevcut, im];
      yaz(K.isaret, D.isaretler); ciz();
    }
    else if(eylem==='isaret-temizle'){
      const t=D.acikTarif; delete D.isaretler[t.id]; yaz(K.isaret, D.isaretler); ciz();
    }
    else if(eylem==='grup-sec'){ D.grup = deger; ciz(); const g=document.querySelector('[data-eylem="liste-girdi"]'); if(g) g.focus(); }
    else if(eylem==='liste-ekle'){ await urunEkle(); }
    else if(eylem==='liste-degistir'){
      if(e.target.closest('[data-eylem="liste-sil"]')) return;
      const u = D.liste.find(x=>x.id===deger);
      if(u) await urunKaydet(Object.assign({}, u, {bitti:!u.bitti}));
    }
    else if(eylem==='liste-sil'){ await urunKaldir(deger); }
    else if(eylem==='liste-temizle'){ await alinanlariSil(); bildir('Alınanlar silindi'); }

    else if(eylem==='tarif-sil'){ silmeOnayi(D.acikTarif); }
    else if(eylem==='paylasim-bilgisi'){ paylasimKutusu(); }
    } catch(e){ bildir('İşlem tamamlanamadı. Bağlantını kontrol edip tekrar dene.'); ciz(); }
  });

  document.getElementById('uygulama').addEventListener('input', e=>{
    const d=e.target.closest('[data-eylem]'); if(!d) return;
    if(d.dataset.eylem==='liste-girdi'){ D.girdi = d.value; return; }
    if(d.dataset.eylem==='arama-girdi'){
      D.arama = d.value;
      const konum = d.selectionStart;
      if(D.ekran==='ana'){ D.ekran='tarifler'; D.filtre='hepsi'; }
      ciz();
      const yeni = document.querySelector('[data-eylem="arama-girdi"]');
      if(yeni){ yeni.focus(); yeni.setSelectionRange(konum,konum); }
    }
  });

  document.getElementById('uygulama').addEventListener('keydown', async e=>{
    const d=e.target.closest('[data-eylem]'); if(!d) return;
    if(d.dataset.eylem==='liste-girdi' && e.key==='Enter'){ e.preventDefault(); try{ await urunEkle(); }catch(e){ bildir('Ürün kaydedilemedi. Tekrar dene.'); } }
    if(d.dataset.eylem==='liste-degistir' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); d.click(); }
  });

  /* ---------- pencereler ---------- */
  function kapat(){ document.querySelectorAll('.perde').forEach(e=>e.remove()); }
  function perdeAc(html){
    kapat();
    const p=document.createElement('div'); p.className='perde';
    p.innerHTML=`<div class="kutucuk" role="dialog" aria-modal="true">${html}</div>`;
    p.addEventListener('click', async ev=>{
      if(ev.target===p){ kapat(); return; }
      const d = ev.target.closest('[data-eylem]');
      if(!d) return;
      try {
      if(d.dataset.eylem==='kapat') kapat();
      else if(d.dataset.eylem==='cikis') await cikis();
      else if(d.dataset.eylem==='disa-aktar') disaAktar();
      else if(d.dataset.eylem==='sil-onayla'){
        const t = D.acikTarif; if(!t) return;
        d.disabled = true; d.textContent = 'Siliniyor…';
        await tarifKaldir(t.id);
        D.favoriler = D.favoriler.filter(x=>x!==t.id); yaz(K.favori, D.favoriler);
        kapat(); D.acikTarif=null; D.ekran='tarifler'; ciz(); bildir('Tarif silindi');
      }
      } catch(e){ bildir('İşlem tamamlanamadı. Tekrar dene.'); d.disabled=false; d.textContent='Tekrar dene'; }
    });
    document.body.appendChild(p);
    const ilk = p.querySelector('button'); if(ilk) ilk.focus();
  }
  function silmeOnayi(t){
    perdeAc(`<h3>“${kacir(t.ad)}” silinsin mi?</h3>
      <p style="line-height:1.55">Tarif herkesin listesinden kalkar ve geri alınamaz.</p>
      <div class="dugme-satiri"><button class="dugme ikincil" data-eylem="kapat">Vazgeç</button>
      <button class="dugme" style="background:var(--kirmizi)" data-eylem="sil-onayla">Evet, sil</button></div>`);
  }
  function paylasimKutusu(){
    perdeAc(`<h3>İkimizin mutfağı</h3>
      <p style="line-height:1.6">${kacir(OTURUM.kullanici?.email || '')} hesabıyla giriş yaptın. Tarifler ve alışveriş listesi yalnızca izin verilen hesaplara açık.</p>
      <p><button class="dugme ikincil" data-eylem="cikis">Hesaptan çık</button></p>
      <div class="dugme-satiri">
        <button class="dugme" data-eylem="disa-aktar">Yedek dosyası indir</button>
        <label class="dugme ikincil" for="yedek-dosya" style="cursor:pointer">Yedekten yükle
          <input type="file" id="yedek-dosya" accept="application/json,.json" style="display:none"></label>
      </div>
      <div class="uyari">Ara sıra yedek indirip bir yere kaydet — kaza olursa tariflerin elinde kalsın.</div>
      <div class="dugme-satiri"><button class="dugme ikincil" data-eylem="kapat">Kapat</button></div>`);
    const d = document.getElementById('yedek-dosya');
    if(d) d.addEventListener('change', e=>{ const f = e.target.files[0]; if(f) iceAktar(f); });
  }

  /* ---------- açılış ---------- */
  function veriDegisti(){
    // form doldururken ekranı yeniden çizmeyelim, yazdıkları kaybolmasın
    if(D.ekran === 'form') return;
    ciz();
  }

  async function yukle(){
    ciz();
    try{
      if(!ayarlarVar()) throw new Error('ayarlar');
      BULUT_ADAYI=await bulutuBaslat();
      A.onAuthStateChanged(AUTH, oturumDegisti, ()=>{
        ++oturumSurumu; veriyiTemizle(); OTURUM.durum='kapali'; OTURUM.mesaj='Oturum doğrulanamadı. Sayfayı yenileyip tekrar dene.'; ciz();
      });
    }catch(e){
      OTURUM.durum='kapali'; OTURUM.mesaj='Giriş hizmetine bağlanılamadı. Bağlantını ve uygulama ayarlarını kontrol et.'; ciz();
    }
  }
  yukle();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
